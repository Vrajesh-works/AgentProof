name: Bug report
description: Something in AgentProof behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command or page, and the output or screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Suite file, agent config and the exact `agentproof` command, if relevant.
      placeholder: |
        1. agentproof run suites/retail.yaml --agent agents/candidate.yaml
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [runner / checkers, environments / MCP, API / storage, viewer, GitHub Action, Docker / setup]
