[project]
name = "agentproof"
version = "0.1.0"
description = "Regression testing for tool-using AI agents: YAML task suites, end-state checks, pass^k reliability, traces, CI gate."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "sqlalchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
agentproof = "agentproof.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
markers = [
    "integration: spawns processes or touches a database",
    "postgres: needs DATABASE_URL pointing at PostgreSQL",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
